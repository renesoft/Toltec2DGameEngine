# Example UnitAnimationConfig file.
# Brackets are always: [gender][weapon][status][angle]
#   gender: man | woman | *
#   weapon: free-form key (sword, bow, unarmed, ...) | *
#   status: idle | walk | run | attack | hit | falling | dying | lying | berserk | *
#   angle : 0..315 step 45 (0 = facing up/north, clockwise) or N/NE/E/SE/S/SW/W/NW | *

basedir=./
bgcolor=0,0,0

# Walk cycle, already cut into 3 frames per direction.
anim[woman][sword][walk][*]   = woman/WalkForward_Sword/WalkForward_Sword_Body_{angle}.png

# duration = total wall-clock time (ms) to play the clip once, independent of
# tickIntervalMs. For walk/run this is ALSO how long the unit takes to cross
# one map cell (see Unit#stepAlongPath), so the walk cycle and the movement
# stay in sync. If you'd rather keep the old "N ticks per frame" timing, use
# speed[...] instead (see UnitAnimationConfig for details) — duration wins if
# both are present.
duration[woman][sword][walk][*]  = 400

# Idle: one static pose per direction is enough — no per-frame animation needed.
anim[woman][sword][idle][*]    = woman/Idle_Sword/Idle_Sword_Body_{angle}.png
anim[woman][sword][attack][*] = woman/Attack_Sword/Attack_Sword_Body_{angle}.png
# Attack plays once, over this many ms, then Unit#onAnimationFinished fires —
# that's when Player actually lands the hit (see Player#attack / #landHit),
# not the instant the player clicked.
duration[woman][sword][attack][*]= 700
loop[woman][sword][attack][*] = false

# Draw the player noticeably bigger than one map cell — feet stay anchored to
# the same point on the tile regardless of this value (see AnimationClip#scale).
#scale[woman][sword][*][*] = 1.4

# Combat rolls (see Unit#hitChance / dodgeChance / blockChance / attackInterruptChance).
# attackInterruptChance in particular is what actually fixes "the player never lands a
# hit with a slow attack": at 1.0 (the default if this line is omitted) ANY damage taken
# mid-swing cancels the swing outright, so a long duration[...][attack][...] can end up
# never finishing while under fire. Lower it so the swing has a real chance to survive
# getting tagged once and still land.
hitChance[woman][sword][*][*]             = 0.9
dodgeChance[woman][sword][*][*]           = 0.1
blockChance[woman][sword][*][*]           = 0.15
attackInterruptChance[woman][sword][*][*] = 0.3

# One lying pose covers every direction — angle wildcard fills the gap.
#img[woman][*][lying][*]       = lying.png

# ── Goblin (see Goblin.java) ────────────────────────────────────────────────
# Uses gender "goblin" (Gender.GOBLIN) so it doesn't collide with man/woman entries.

anim[goblin][unarmed][walk][*]   = enemy/Walk/Walk_Body_{angle}.png
duration[goblin][unarmed][walk][*]   = 400
anim[goblin][unarmed][idle][*]   = enemy/Idle_Simple/Idle_Simple_Body_{angle}.png
anim[goblin][unarmed][attack][*] = enemy/Attack_01/Attack_01_Body_{angle}.png
# Attack plays once, over this many ms; damage lands only once it finishes
# (see Goblin#onAnimationFinished / #landHit) — not when it started.
duration[goblin][unarmed][attack][*] = 700
loop[goblin][unarmed][attack][*] = false
anim[goblin][unarmed][hit][*]    = enemy/Hit/Hit_Body_{angle}.png
duration[goblin][unarmed][hit][*]    = 300
loop[goblin][unarmed][hit][*]    = false
anim[goblin][unarmed][dying][*]  = enemy\Death_from_Idle/Death_from_Idle_Body_{angle}.png
# How long the death animation takes to play before the goblin switches to LYING
# (see Unit#onAnimationFinished / Goblin#onAnimationFinished).
duration[goblin][unarmed][dying][*]  = 700
loop[goblin][unarmed][dying][*]  = false
#img[goblin][*][lying][*]         = Goblin/Goblin_Lying.png
#scale[goblin][unarmed][*][*] = 2
# Combat rolls — see the woman/sword block above for what each one does.
hitChance[goblin][unarmed][*][*]             = 0.85
dodgeChance[goblin][unarmed][*][*]           = 0.05
blockChance[goblin][unarmed][*][*]           = 0.1
attackInterruptChance[goblin][unarmed][*][*] = 0.5

fitToCell[*][*][*][*]             = true
scale[*][*][*][*]                 = 1.0
sizeCells[*][*][*][*]             = 1
