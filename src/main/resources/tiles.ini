# TileTextureConfig file — see TileTextureConfig for the full format docs.
#
# Each type gets up to 4 orientation-variant images (img[type][N/E/S/W]),
# used only for visual variety (TileType#pickVariant deterministically picks
# one per cell so a large floor area doesn't look like one image stamped
# over and over) — plus 3 gameplay parameters:
#   walkable[type]        - can a unit walk onto this tile?      default true
#   speedMultiplier[type] - movement-speed multiplier while on it default 1.0
#   damagePerSecond[type] - damage/sec applied while standing on it default 0

basedir=tiles

img[brickFloor1][N] = Floor_Brick_01-_17.png
img[brickFloor1][E] = Floor_Brick_01-_17.png
img[brickFloor1][S] = Floor_Brick_01-_17.png
img[brickFloor1][W] = Floor_Brick_01-_17.png
walkable[brickFloor1] = true

img[water][N] = Overworld - Water - Flat_0.png
img[water][E] = Overworld - Water - Flat_0.png
img[water][S] = Overworld - Water - Flat_0.png
img[water][W] = Overworld - Water - Flat_0.png
walkable[water] = false

# ── dirt — plain, walkable, but slow going (e.g. soft/loose ground) ────────
img[dirt][N] = dirt_N.png
img[dirt][E] = dirt_E.png
img[dirt][S] = dirt_S.png
img[dirt][W] = dirt_W.png
walkable[dirt]        = true
speedMultiplier[dirt] = 0.5

# ── dirtTiles — walkable but hurts to stand on (e.g. caltrops/thorns) ──────
img[dirtTiles][N] = dirtTiles_N.png
img[dirtTiles][E] = dirtTiles_E.png
img[dirtTiles][S] = dirtTiles_S.png
img[dirtTiles][W] = dirtTiles_W.png
walkable[dirtTiles]        = true
damagePerSecond[dirtTiles] = 5

# ── planks — normal walkable flooring, no penalties ─────────────────────────
img[planks][N] = planks_N.png
img[planks][E] = planks_E.png
img[planks][S] = planks_S.png
img[planks][W] = planks_W.png
walkable[planks] = true

# ── planksBroken — impassable (rotted through) ───────────────────────────────
img[planksBroken][N] = planksBroken_N.png
img[planksBroken][E] = planksBroken_E.png
img[planksBroken][S] = planksBroken_S.png
img[planksBroken][W] = planksBroken_W.png
walkable[planksBroken] = false

# ── planksHole — an actual hole in the floor: impassable ────────────────────
img[planksHole][N] = planksHole_N.png
img[planksHole][E] = planksHole_E.png
img[planksHole][S] = planksHole_S.png
img[planksHole][W] = planksHole_W.png
walkable[planksHole] = false

# ── stone — normal walkable flooring, no penalties ───────────────────────────
img[stone][N] = stone_N.png
img[stone][E] = stone_E.png
img[stone][S] = stone_S.png
img[stone][W] = stone_W.png
walkable[stone] = true

# ── stoneInset — normal walkable flooring, no penalties ──────────────────────
img[stoneInset][N] = stoneInset_N.png
img[stoneInset][E] = stoneInset_E.png
img[stoneInset][S] = stoneInset_S.png
img[stoneInset][W] = stoneInset_W.png
walkable[stoneInset] = true
