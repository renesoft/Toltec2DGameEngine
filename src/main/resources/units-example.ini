# Example UnitAnimationConfig file.
# Brackets are always: [gender][weapon][status][angle]
#   gender: man | woman | *
#   weapon: free-form key (sword, bow, unarmed, ...) | *
#   status: idle | walk | run | attack | hit | falling | dying | lying | berserk | *
#   angle : 0..315 step 45 (0 = facing up/north, clockwise) or N/NE/E/SE/S/SW/W/NW | *

basedir=units/woman_sword
bgcolor=0,0,0

# Walk cycle, already cut into 3 frames per direction.
anim[woman][sword][walk][0]   = resources/WalkForward_Sword/WalkForward_Sword_Body_000.png
anim[woman][sword][walk][45]  = resources/WalkForward_Sword/WalkForward_Sword_Body_045.png
anim[woman][sword][walk][90]  = resources/WalkForward_Sword/WalkForward_Sword_Body_090.png
anim[woman][sword][walk][135] = resources/WalkForward_Sword/WalkForward_Sword_Body_135.png
anim[woman][sword][walk][180] = resources/WalkForward_Sword/WalkForward_Sword_Body_180.png
anim[woman][sword][walk][225] = resources/WalkForward_Sword/WalkForward_Sword_Body_225.png
anim[woman][sword][walk][270] = resources/WalkForward_Sword/WalkForward_Sword_Body_270.png
anim[woman][sword][walk][315] = resources/WalkForward_Sword/WalkForward_Sword_Body_315.png
# duration = total ms to play the walk cycle once; also how long the unit
# takes to cross one map cell (see Unit#stepAlongPath). Use speed[...]
# instead for the old tick-based timing.
duration[woman][sword][walk][*]  = 500

# Idle: one static pose per direction is enough — no per-frame animation needed.
anim[woman][sword][idle][0]    = resources/Idle_Sword/Idle_Sword_Body_000.png
anim[woman][sword][idle][45]   = resources/Idle_Sword/Idle_Sword_Body_045.png
anim[woman][sword][idle][90]   = resources/Idle_Sword/Idle_Sword_Body_090.png
anim[woman][sword][idle][135]  = resources/Idle_Sword/Idle_Sword_Body_135.png
anim[woman][sword][idle][180]  = resources/Idle_Sword/Idle_Sword_Body_180.png
anim[woman][sword][idle][225]  = resources/Idle_Sword/Idle_Sword_Body_225.png
anim[woman][sword][idle][270]  = resources/Idle_Sword/Idle_Sword_Body_270.png
anim[woman][sword][idle][315]  = resources/Idle_Sword/Idle_Sword_Body_315.png

# Attack plays once, over duration[...] ms, then Unit#onAnimationFinished
# fires (see Player#attack) — that's when damage should actually land.
#anim[woman][sword][attack][*] = attack.1.png|attack.2.png|attack.3.png|attack.4.png
#duration[woman][sword][attack][*] = 400
#loop[woman][sword][attack][*] = false

# One lying pose covers every direction — angle wildcard fills the gap.
#img[woman][*][lying][*]       = lying.png
